services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-code-intelligence-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: code_intelligence
      POSTGRES_USER: code_user
      POSTGRES_PASSWORD: code_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U code_user -d code_intelligence"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: ai-code-intelligence-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data: